# ImageNet ResNet-18, frozen backbone (linear probe) on Dogs vs Cats: full train/ (20k), full val/ (5k).
# 11/3 hand-off checkpoint for A's submission pipeline -> runs/dvc_r18_linear_probe/seed0/best.pt
#   python -m scripts.train_dvc --config configs/dvc_r18_linear_probe.yaml [--data-root DIR]
exp_name: dvc_r18_linear_probe
task: dvc
member: B
model: resnet18
num_classes: 2
pretrained: true
freeze: backbone
aug: flip
img_size: 224
optimizer: sgd
lr: 1e-2
wd: 1e-4
bs: 64
epochs: 5
scheduler: cosine
warmup_epochs: 0.5
amp: true
channels_last: false   # pinned (the trainer default since 11/1); the fb26e20 hand-off run used it
seed: 0
num_workers: 4
